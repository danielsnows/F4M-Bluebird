      // a node without its own tracks (e.g. an instance whose variants animate inside it) can still be faded in/out
      n.fo = (ov && ov.fade) || (n.x && n.x.fo) || null; n.fi = (ov && ov.fin) || (n.x && n.x.fi) || null;
      if ((n.fo || n.fi) && !fxOnly.includes(n)) fxOnly.push(n);

      el.style.left = mo ? ((L + mo[0]) / mo[2]) + 'px' : n.l;

        let tf = b.mt ? `translate(${px(x)},${px(y)}) matrix(${b.mt.join(',')})` : `translate(${px(x)},${px(y)}) rotate(${a}rad)${b.f ? ' scale(1,-1)' : ''}`;
        if (T.k) tf += ` scale(${Math.round(g('k', 1) * 100000) / 100000})`;
        if (ar || sx !== 1 || sy !== 1) { const cx = b.pv ? b.pv[0] : w / 2, cy = b.pv ? b.pv[1] : h / 2; tf += ` translate(${px(cx)},${px(cy)}) rotate(${ar}deg) scale(${sx},${sy}) translate(${px(-cx)},${px(-cy)})`; }
        put(r, 'tf', tf, (v) => (st.transform = v));
        if (T.w || r.wo) put(r, 'w', w, (v) => (st.width = px(v)));
        if (T.h) put(r, 'h', h, (v) => (st.height = px(v)));
      }
      if (T.r) put(r, 'r', g('r', 0), (v) => (st.borderRadius = px(v)));
      if (T.bg) { const c = g('bg'); put(r, 'bg', `rgba(${c[0] | 0},${c[1] | 0},${c[2] | 0},${Math.round(c[3] * 1000) / 1000})`, (v) => (b.fc ? (st.color = v) : (st.backgroundColor = v))); }
      if (T.tc) { const c = g('tc'); put(r, 'tc', `rgba(${c[0] | 0},${c[1] | 0},${c[2] | 0},${Math.round(c[3] * 1000) / 1000})`, (v) => (st.color = v)); }
      if (T.ex) put(r, 'ex', g('ex', 0), (v) => (st.filter = `brightness(${Math.round((1 + v) * 10000) / 10000})`));
      if (T.blur) put(r, 'blur', g('blur', 0), (v) => (st.filter = `blur(${px(v)})`));
    }
  }

  /* ---------------------------------------------------------------- layout */
  const blocks = S.blocks.map((b) => ({ ...b, el: document.getElementById(b.id) })).filter((b) => b.el);
  let zoomScalesOffsets = true;
  function calibrateZoom() {
    const p = document.createElement('div');
    p.style.cssText = 'position:absolute;left:10px;top:0;width:2px;height:2px;zoom:2;visibility:hidden';
    stage.appendChild(p);
    zoomScalesOffsets = Math.abs(p.getBoundingClientRect().left - stage.getBoundingClientRect().left - 20) < 3;
    p.remove();
  }
  function layout() {
    const W = stage.clientWidth, H = stage.clientHeight;
    const M = S.mobile && (W < 768 || W / H < 0.82) ? S.mobile : null;
    isM = !!M;
    root.classList.toggle('is-m', isM);
    const FW = S.frame.w, FH = S.frame.h;
    const s = Math.min(W / FW, H / FH), cov = Math.max(W / FW, H / FH);
    const sm = M ? Math.min(W / M.w, H / M.h) : 0;
    curScale = M ? sm : s;
    stage.style.setProperty('--s', curScale);  // design px → css px (for config CSS that must follow the design scale)
    for (const b of blocks) {
      const cov$ = b.bleed && !(M && b.dbo); // dbo: cover only on desktop
      const cfg = M ? (M.blocks[b.k] || M.blocks[b.id] || (cov$ ? {} : null)) : null;
      if (M && (!cfg || cfg.hide)) { b.el.style.display = 'none'; continue; }
      b.el.style.display = '';
      let z, L, T;
      if (cov$) {
        const fx = cfg && cfg.fx != null ? cfg.fx : (b.fa ? b.fa[0] : 0.5), fy = cfg && cfg.fy != null ? cfg.fy : (b.fa ? b.fa[1] : 0.5);
        z = cov * (cfg && cfg.z ? cfg.z : 1);
        L = (W - FW * z) * fx + b.x * z; T = (H - FH * z) * fy + b.y * z;
      } else if (M) {
        z = sm * (cfg.z || 1);
        const ox = (W - M.w * sm) / 2, oy = (H - M.h * sm) / 2;
        const ax = cfg.ax != null ? cfg.ax : 0, ay = cfg.ay != null ? cfg.ay : 0;
        L = ox * (1 + ax) + cfg.x * sm; T = oy * (1 + ay) + cfg.y * sm;
      } else {
        z = s;
        const mx = (W - FW * s) / 2, my = (H - FH * s) / 2;
        L = mx * (1 + b.ax) + b.x * s; T = my * (1 + b.ay) + b.y * s;
      }
      const f = zoomScalesOffsets ? z : 1;
      b.el.style.zoom = z;
      b.el.style.left = (L / f) + 'px';
      b.el.style.top = (T / f) + 'px';
      b.z = z; b.sx0 = L - b.x * z; b.sy0 = T - b.y * z;
    }
    L$ = { W, H, FW, FH, s, cov, sm, mox: M ? (W - M.w * sm) / 2 : 0, moy: M ? (H - M.h * sm) / 2 : 0 };
    const per = isM ? S.vhPerSecM || 34 : S.vhPerSec || 40;
    hero.style.setProperty('--track', Math.max(0, Math.round((S.end - S.intro) * per)) + 'vh');
    for (const r of els) r.c = {};
    applyNodeOv();
  }

  /* ---------------------------------------------------------------- media */
  const videos = (S.videos || []).map((v) => ({ ...v, el: document.getElementById(v.id) })).filter((v) => v.el);
  const blobs = {};
  function fetchBlob(url, onp) {
    if (blobs[url]) return Promise.resolve(blobs[url]);
    return fetch(url).then((res) => {
      if (!res.ok) throw new Error(res.status);
      const total = +res.headers.get('content-length') || 0;
      if (!res.body || !total) return res.blob();
      const rd = res.body.getReader(), chunks = []; let got = 0;
      const pump = () => rd.read().then(({ done, value }) => { if (done) return new Blob(chunks, { type: res.headers.get('content-type') || 'video/mp4' }); chunks.push(value); got += value.length; onp && onp(got / total); return pump(); });
      return pump();
    }).then((b) => (blobs[url] = URL.createObjectURL(b))).catch(() => url);
  }
  function attach(v) {
    const url = v.el.dataset.src;
    v.el.addEventListener('error', () => { if (v.el.src.startsWith('blob:')) { v.el.src = url; v.el.load(); } }, { once: true });
    v.el.src = blobs[url] || url;
    if (v.mode === 'loop') { v.el.loop = true; }
    if (v.mode === 'once') { v.el.loop = false; v.el.removeAttribute('loop'); }
  }
  function syncMedia(t) {
    for (const v of videos) {
      if (v.mode === 'scrub') {
        if (v.el.readyState >= 2 && !v.el.seeking) {
          const d = v.el.duration || v.dur || 1;
          let vt = Math.max(0, t - (v.t0 || 0)) * (v.rate || 1);
          vt = v.wrap ? vt % d : Math.min(vt, d - 0.04);
          if (Math.abs(v.el.currentTime - vt) > 0.012) v.el.currentTime = vt;
        }
      } else if (v.mode === 'once') {
        // plays through once with the autoplayed timeline (no scroll scrubbing) and rests on its last frame
        const on = started && t >= (v.t0 || 0) - 0.05;
        if (on !== v.on) {
          v.on = on;
          if (on && reduced) { const d = v.el.duration || v.dur || 1; v.el.currentTime = Math.max(0, d - 0.05); }
          else if (on) { v.el.currentTime = Math.max(0, t - (v.t0 || 0)); const p = v.el.play(); p && p.catch(() => {}); }
          else v.el.pause();
        }
      } else {
        const on = t >= (v.t0 || 0) - 0.05;
        if (on !== v.on) { v.on = on; if (on) { const p = v.el.play(); p && p.catch(() => {}); } else v.el.pause(); }
      }
    }
  }

  /* ---------------------------------------------------------------- scroll */
  let lenis = null, t = 0, ready = false, started = false, snapping = false, dir = 1, idle = 0, lastY = 0;
  const INTRO = reduced ? S.end : S.intro, END = S.end;
  const range = () => { const top = hero.offsetTop; return [top, top + hero.offsetHeight - stage.clientHeight]; };
  const tFromY = (y) => { const [a, b] = range(); const p = b > a ? Math.min(1, Math.max(0, (y - a) / (b - a))) : 1; return INTRO + p * (END - INTRO); };
  const yFromT = (tt) => { const [a, b] = range(); return a + ((tt - INTRO) / (END - INTRO || 1)) * (b - a); };
  function onScroll() {
    const y = lenis ? lenis.scroll : window.scrollY;
    dir = y > lastY ? 1 : y < lastY ? -1 : dir; lastY = y;
    if (!ready) return;
    t = tFromY(y);
    if (!reduced) armSnap();
  }
  function armSnap() {
    clearTimeout(idle);
    if (snapping || !lenis || window.__noSnap || !S.holds || !S.holds.length) return;
    idle = setTimeout(() => {
      if (S.holds.some(([a, b]) => t >= a - 0.02 && t <= b + 0.02)) return;
      let target;
      if (dir > 0) target = (S.holds.find(([a]) => a > t) || S.holds[S.holds.length - 1])[0];
      else target = ([...S.holds].reverse().find(([, b]) => b < t) || S.holds[0])[1];
      snapping = true;
      lenis.scrollTo(yFromT(target), { duration: Math.min(1.8, Math.max(0.6, Math.abs(target - t) * 0.45)), easing: (x) => (x < 0.5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2), onComplete: () => { snapping = false; } });
      setTimeout(() => { snapping = false; }, 2200);
    }, 170);
  }

  /* ---------------------------------------------------------------- parallax */
  let px0 = 0, py0 = 0, pxT = 0, pyT = 0;
  const bleeds = blocks.filter((b) => b.bleed && b.par);
  if (fine && !reduced && bleeds.length) {
    window.addEventListener('pointermove', (e) => { pxT = (e.clientX / innerWidth - 0.5); pyT = (e.clientY / innerHeight - 0.5); }, { passive: true });
  }
  function parallax() {
    if (!bleeds.length) return;
    px0 += (pxT - px0) * 0.06; py0 += (pyT - py0) * 0.06;
    for (const b of bleeds) b.el.style.translate = `${(-px0 * b.par).toFixed(2)}% ${(-py0 * b.par).toFixed(2)}%`;
  }

  /* ---------------------------------------------------------------- pointer: parallax, custom cursor, hover */
  // S.ptr = {blocks: {key: [kx, ky]}, fade: [t0, t1]}: blocks follow the pointer (frame px per normalised offset)
  // S.cur = {size, fade: [t0, t1]}: custom cursor dot (exclusion blend) replacing the system cursor
  // S.hov = {f: figmaId, a, b}: hovering that node plays the [a, b] segment of the timeline forward
  const ptrOn = fine && !reduced;
  let pin = false, ex = -200, ey = -200, cx = -200, cy = -200, pxs = 0, pys = 0, hv = 0, curScale = 1;
  const pBlocks = (S.ptr && ptrOn) ? Object.entries(S.ptr.blocks).map(([k, f]) => ({ b: blocks.find((x) => x.k === k), f })).filter((o) => o.b) : [];
  let curEl = null;
  if (S.cur && ptrOn) { curEl = document.createElement('div'); curEl.className = 'cur'; curEl.setAttribute('aria-hidden', 'true'); stage.appendChild(curEl); }
  const hovEl = S.hov && ptrOn ? document.querySelector(`[data-f="${CSS.escape(S.hov.f)}"]`) : null;
  if (ptrOn && (pBlocks.length || curEl || hovEl)) {
    window.addEventListener('pointermove', (e) => { const r = stage.getBoundingClientRect(); ex = e.clientX - r.left; ey = e.clientY - r.top; if (!pin) { cx = ex; cy = ey; } pin = true; }, { passive: true });
    document.documentElement.addEventListener('pointerleave', () => { pin = false; });
  }
  const fadeW = (fd) => (!fd ? 1 : t <= fd[0] ? 1 : t >= fd[1] ? 0 : 1 - (t - fd[0]) / (fd[1] - fd[0]));
  function pointerFx() {
    const W = stage.clientWidth, H = stage.clientHeight;
    const nx = pin ? Math.max(-1, Math.min(1, (ex / W - 0.5) * 2)) : 0, ny = pin ? Math.max(-1, Math.min(1, (ey / H - 0.5) * 2)) : 0;
    pxs += (nx - pxs) * 0.06; pys += (ny - pys) * 0.06;
    if (pBlocks.length) {
      const w = isM ? 0 : fadeW(S.ptr.fade);
      for (const o of pBlocks) o.b.el.style.translate = `${(pxs * o.f[0] * w).toFixed(2)}px ${(pys * o.f[1] * w).toFixed(2)}px`;
    }
    if (curEl) {
      const cw = isM ? 0 : fadeW(S.cur.fade);
      cx += (ex - cx) * 0.3; cy += (ey - cy) * 0.3;
      const sz = S.cur.size * curScale;
      curEl.style.width = curEl.style.height = px(sz);
      curEl.style.transform = `translate(${px(cx - sz / 2)},${px(cy - sz / 2)})`;
      curEl.style.opacity = pin ? cw : 0;
      root.classList.toggle('has-cur', pin && cw > 0.5);
    }
    if (hovEl) {
      let on = false;
      if (pin && t >= S.hov.a - 0.05 && t <= S.hov.b) {
        const r = hovEl.getBoundingClientRect(), sr = stage.getBoundingClientRect();
        const dx = ex - (r.left - sr.left + r.width / 2), dy = ey - (r.top - sr.top + r.height / 2);
        on = r.width > 0 && dx * dx + dy * dy <= (r.width / 2) * (r.width / 2);
      }
      hv += ((on ? 1 : 0) - hv) * 0.12;
      if (hv < 0.001) hv = 0;
    }
  }
  function effT() {
    if (!S.hov || !hv || t < S.hov.a - 0.05 || t > S.hov.b) return t;
    return Math.max(t, S.hov.a + hv * (S.hov.b - S.hov.a));
  }

  /* ---------------------------------------------------------------- hover states: buttons, menu links, cards */
  // S.hv = {text: accentColor, mix: 0..1, light: overlayOnLightButtons, dark: overlayOnDarkOrGlassButtons, zoom: {figmaId: scale}}
  // buttons (links with a visible surface) get a soft tint layer above their fill; menu/text links blend their text colour
  // towards the accent; icon-only links dim slightly; zoom cards scale their images inside their own clip.
  if (S.hv && window.matchMedia && matchMedia('(hover: hover) and (pointer: fine)').matches) {
    const HV = S.hv, K = HV.mix == null ? 1 : HV.mix;
    const rgbOf = (c) => { const m = (c || '').match(/rgba?\(([^)]+)\)/); if (!m) return null; const q = m[1].split(/[\s,/]+/).filter(Boolean).map(Number); return { r: q[0], g: q[1], b: q[2], a: q.length > 3 ? q[3] : 1 }; };
    const probe = document.createElement('i'); probe.style.color = HV.text || '#ffffff'; document.body.appendChild(probe);
    const acc = rgbOf(getComputedStyle(probe).color) || { r: 255, g: 255, b: 255 }; probe.remove();
    const mixC = (c) => `rgb(${Math.round(c.r + (acc.r - c.r) * K)},${Math.round(c.g + (acc.g - c.g) * K)},${Math.round(c.b + (acc.b - c.b) * K)})`;
    const isLayer = (el) => el.tagName === 'I' && /\b(pl|bb|gl|is)\b/.test(el.className);
    const surfaceOf = (a) => {
      const own = a.classList.contains('lk') ? a.parentElement : a;
      // a surface is a coloured/glass fill or an outline; an image fill alone (logo, icon, photo) is not a button surface
      const vis = (el) => { const cs = getComputedStyle(el), bg = rgbOf(cs.backgroundColor); return (bg && bg.a > 0.03) || cs.backgroundImage !== 'none' || [...el.children].some((c) => c.tagName === 'I' && (/\b(bb|gl)\b/.test(c.className) || (/\bpl\b/.test(c.className) && !c.querySelector('img,video')))) || el.querySelector(':scope > .sk'); };
      if (own.classList.contains('g')) {   // group link: its surface is the largest filled child box
        let best = null, ba = 0;
        own.querySelectorAll(':scope > .b').forEach((c) => { const r = c.getBoundingClientRect(), ar = r.width * r.height; if (vis(c) && ar > ba) { best = c; ba = ar; } });
        return best;
      }
      return vis(own) ? own : null;
    };
    const tone = (el) => { const bg = rgbOf(getComputedStyle(el).backgroundColor); const lum = bg && bg.a > 0.5 ? (0.2126 * bg.r + 0.7152 * bg.g + 0.0722 * bg.b) / 255 : 0; return lum > 0.6 ? (HV.light || 'rgba(0,0,0,.07)') : (HV.dark || 'rgba(255,255,255,.16)'); };
    const bind = (a, on, off) => { a.addEventListener('pointerenter', on); a.addEventListener('pointerleave', off); a.addEventListener('focus', on); a.addEventListener('blur', off); };
    document.querySelectorAll('#stage .blk a').forEach((a) => {
      if (a.closest('nav') || a.matches('.t, .lt')) {   // menu items and text links: colour change
        const els = [a, ...a.querySelectorAll('*')];
        let tm = 0;
        bind(a, () => {
          clearTimeout(tm);
          els.forEach((el) => { const c = rgbOf(getComputedStyle(el).color); if (c && c.a > 0) el.style.setProperty('--hvc', mixC(c)); });
          a.classList.add('hv-tr'); requestAnimationFrame(() => a.classList.add('is-hv'));
        }, () => { a.classList.remove('is-hv'); tm = setTimeout(() => a.classList.remove('hv-tr'), 420); });
        a.classList.add('hv-tx');
        return;
      }
      const sf = surfaceOf(a);
      if (!sf) { a.classList.add('hv-ic'); return; }
      const o = document.createElement('i'); o.className = 'hvo'; o.setAttribute('aria-hidden', 'true');
      o.style.background = tone(sf);
      const first = [...sf.children].find((c) => !isLayer(c));
      sf.insertBefore(o, first || null);
      a.classList.add('hv-bt');
      bind(a, () => o.classList.add('is-hv'), () => o.classList.remove('is-hv'));
    });
    for (const [f, k] of Object.entries(HV.zoom || {})) {
      document.querySelectorAll(`[data-f="${CSS.escape(f)}"]`).forEach((el) => { el.classList.add('hz'); el.style.setProperty('--hz', k); });
    }
  }

  /* ---------------------------------------------------------------- loop */
  function frame(now) {
    if (lenis) lenis.raf(now);
    pointerFx();
    applyAt(effT()); syncMedia(t); parallax();
    requestAnimationFrame(frame);
  }

  /* ---------------------------------------------------------------- boot */
  calibrateZoom();
  // lock the page before the first measure: with classic (non-overlay) scrollbars, measuring while the page can still
  // scroll would lay everything out for a viewport narrowed by the scrollbar, which then disappears
  root.classList.add('is-locked');
  layout();
  applyAt(0);
  if (!reduced && window.Lenis) {
    lenis = new Lenis({ lerp: 0.085, wheelMultiplier: 0.9, smoothWheel: true });
    lenis.on('scroll', onScroll);
    lenis.stop();
  } else {
    window.addEventListener('scroll', onScroll, { passive: true });
  }
  window.scrollTo(0, 0);
  let rz = 0, lastWH = '';
  const relayout = () => { cancelAnimationFrame(rz); rz = requestAnimationFrame(() => { layout(); if (ready) t = tFromY(lenis ? lenis.scroll : scrollY); }); };
  window.addEventListener('resize', relayout);
  // the stage can change size without a window resize (a scrollbar appearing or going away, a side panel…):
  // follow its real box so the layers always sit where the frame is
  if (window.ResizeObserver) new ResizeObserver(() => { const k = stage.clientWidth + 'x' + stage.clientHeight; if (k !== lastWH) { lastWH = k; relayout(); } }).observe(stage);
  requestAnimationFrame(frame);

  const loaderBar = $('#loaderBar'), loaderPct = $('#loaderPct');
  function preload() {
    const jobs = [], prog = new Map(), wt = new Map();
    let shown = 0;
    const report = () => { let a = 0, b = 0; wt.forEach((w, k) => { b += w; a += w * (prog.get(k) || 0); }); shown = Math.max(shown, b ? a / b : 1); if (loaderBar) loaderBar.style.transform = `scaleX(${shown})`; if (loaderPct) loaderPct.textContent = String(Math.round(shown * 100)).padStart(3, '0'); };
    wt.set('fonts', 1);
    jobs.push(document.fonts.ready.then(() => { prog.set('fonts', 1); report(); }));
    document.querySelectorAll('#stage img').forEach((im, i) => {
      const k = 'i' + i; wt.set(k, 0.4);
      // wait until the image is loaded AND decoded, so nothing paints late (empty boxes) once the loader is gone
      const loaded = im.complete ? Promise.resolve() : new Promise((r) => { im.addEventListener('load', r, { once: true }); im.addEventListener('error', r, { once: true }); });
      jobs.push(loaded.then(() => (im.decode ? im.decode().catch(() => {}) : null)).then(() => { prog.set(k, 1); report(); }));
    });
    const seen = new Set();
    videos.forEach((v) => {
      const url = v.el.dataset.src; if (seen.has(url)) return; seen.add(url);
      wt.set(url, v.mode === 'scrub' ? 6 : 1.5);
      jobs.push(fetchBlob(url, (p) => { prog.set(url, p); report(); }).then(() => { prog.set(url, 1); report(); }));
    });
    report();
    return Promise.race([Promise.all(jobs), new Promise((r) => setTimeout(r, 14000))]);
  }
  function waitVideos() {
    return Promise.race([Promise.all(videos.map((v) => new Promise((r) => { if (v.el.readyState >= 2) return r(); v.el.addEventListener('loadeddata', r, { once: true }); v.el.addEventListener('error', r, { once: true }); }))), new Promise((r) => setTimeout(r, 3000))]);
  }
  preload().then(() => { videos.forEach(attach); return waitVideos(); }).then(() => {
    root.classList.remove('is-locked');
    const ld = $('#loader'); if (ld) ld.classList.add('is-done');
    const finish = () => { ready = true; started = true; t = INTRO; if (lenis) lenis.start(); };
    if (reduced || INTRO <= 0) { t = INTRO; finish(); return; }
    // the intro starts once the loader has (mostly) faded out, so it is never seen half-way behind it
    setTimeout(() => {
      let t0 = null;
      const intro = (now) => { if (t0 === null) { t0 = now; started = true; } const p = Math.max(0, Math.min(1, (now - t0) / 1000 / INTRO)); t = p * INTRO; if (p < 1) requestAnimationFrame(intro); else finish(); };
      requestAnimationFrame(intro);
    }, (S.introDelay || 0) * 1000);
  });
  window.__hero = { get t() { return t; }, set t(v) { t = v; }, layout, yFromT, S };
})();
</script>
</body>
